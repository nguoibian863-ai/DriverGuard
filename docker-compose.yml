# Chạy thử: docker compose up --build  => web http://localhost:3000, API http://localhost:8000
# Mặc định backend chạy chế độ MÔ PHỎNG (không cần camera).
# Dùng camera thật trên Linux: đặt DRIVERGUARD_SIMULATE=0 và bỏ chú thích phần devices.
services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DRIVERGUARD_SIMULATE: "${DRIVERGUARD_SIMULATE:-1}"
      DRIVERGUARD_DB: /data/driverguard.db
    volumes:
      - driverguard-data:/data
    # devices:
    #   - "/dev/video0:/dev/video0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  driverguard-data:
