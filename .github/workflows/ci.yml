name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest httpx numpy pyyaml fastapi pydantic websockets
      - name: AI tests
        run: python -m pytest ai -q
      - name: Backend tests
        working-directory: apps/backend
        env:
          DRIVERGUARD_START_WORKER: "0"
        run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # opencv cần libGL; chạy worker mô phỏng nên không cần camera
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install pytest httpx numpy pyyaml fastapi pydantic websockets uvicorn opencv-python-headless
      - name: End-to-end (uvicorn + AI worker mô phỏng)
        run: python -m pytest tests/integration -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
